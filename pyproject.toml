[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ofiqpy"
dynamic = ["version"]
description = "Python implementation of the hash-verified canonical OFIQ v1.1.0 profile"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Aaron Storey" }]
keywords = ["face", "image quality", "biometrics", "ISO 29794-5", "OFIQ", "FIQA"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# Versions used by the reviewed canonical OFIQ v1.1.0 profile.
dependencies = [
    "numpy>=1.23,<2",
    "opencv-python-headless==4.5.5.64",
    "onnxruntime==1.18.1",
]

[project.optional-dependencies]
ci = [
    "cmake==3.26.4; python_version >= '3.11' and python_version < '3.13' and sys_platform == 'linux' and platform_machine == 'x86_64'",
    "conan==2.18.1; python_version >= '3.11' and python_version < '3.13' and sys_platform == 'linux' and platform_machine == 'x86_64'",
]
docs = ["mkdocs-material>=9.5", "mkdocstrings[python]>=0.24"]
notebooks = ["jupyter>=1", "matplotlib>=3.7"]
dev = [
    "pytest>=7",
    "ruff>=0.4",
    "mypy>=1.8",
    "build>=1",
    "setuptools==80.9.0",
    "wheel==0.45.1",
    "jupyter>=1",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/AVHBAC/ofiqpy"
Documentation = "https://avhbac.github.io/ofiqpy/"
Repository = "https://github.com/AVHBAC/ofiqpy"
Issues = "https://github.com/AVHBAC/ofiqpy/issues"

[project.scripts]
ofiqpy = "ofiqpy.cli:main"

[tool.setuptools.packages.find]
include = ["ofiqpy*"]

[tool.setuptools.dynamic]
version = {attr = "ofiqpy._version.__version__"}

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E741"]  # coordinate variables mirror the corresponding OFIQ formulas

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["ofiqpy"]
ignore_missing_imports = true   # cv2 / onnxruntime / numpy C-extensions have no stubs
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
